# Whitelist remote image sources for Netlify's Image CDN (used by @nuxt/image
# on Netlify). APOD stills + video thumbnails, plus YouTube video thumbnails.
[images]
  remote_images = [
    'https://assets.science.nasa.gov/.*',
    'https://img.youtube.com/.*',
    'https://i.ytimg.com/.*'
  ]

[build]
  # Run the unit tests and the type check before building; either failing aborts the deploy.
  command = "npm run test && npm run typecheck && npm run build"

[build.environment]
  # These env vars are consumed only by the server-side Nitro function (SSR) and
  # are never shipped to the browser. Netlify's secret scanner flags their presence
  # in the server bundle / docs, so exclude them from scanning.
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_API_KEY"
